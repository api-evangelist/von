aid: von
name: Von
description: >-
  Von (vonlabs.ai) is an AI RevOps agent from Rattle Software, the Insight
  Partners and Sequoia backed team behind gorattle.com, positioned as an AI
  data scientist for revenue teams. Von connects to CRMs, data warehouses,
  call recorders, and sales engagement tools - Salesforce, HubSpot, Snowflake,
  BigQuery, Databricks, Gong, Outreach, Salesloft, and more, plus 100+
  integrations consumed via MCP - to automate pipeline forecasting, win/loss
  analysis, churn detection, sales coaching, and Salesforce administration.
  Von publishes no public API or developer program; its security posture is
  documented at trust.vonlabs.ai (SOC 2 Type 2, SOC 3, ISO 27001, CASA Tier 2).
