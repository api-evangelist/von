  reason: no-developer-program
  detail: >-
    Von ships an end-user AI RevOps agent and markets no API at all - api.vonlabs.ai
    resolves to a Kubernetes ingress that returns nginx 404 for every path probed,
    mcp.vonlabs.ai is NXDOMAIN, and the company's own build-vs-buy page positions
    its one-click connectors as the alternative to a customer building an MCP server.
